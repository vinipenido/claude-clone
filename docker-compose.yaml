  services:
    postgres:
      image: postgres:16
      container_name: chatgpt-clone-db
      environment:
        POSTGRES_DB: chatclone_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      ports:
        - "5432:5432"
      volumes:
        - chatclone_data:/var/lib/postgresql/data

  volumes:
    chatclone_data:
